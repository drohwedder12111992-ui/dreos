<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DREOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0610">
<title>DREOS Office</title>
<style>
:root{--red:#EA0029;--dark:#31171F;--bg:#0B0610;--teal:#64AAB2;--teal2:#2F7C85;--txt:#F5F2F3;--mut:#C1B9BC;--sub:#8a7b80;--line:rgba(255,255,255,.09);--glass:rgba(16,9,14,.62);--nf:1;--litw:1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05030a;color:var(--txt);font-family:"EOS Office",Arial,Helvetica,sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
/* ===== LOBBY ===== */
#lobby{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1.1s ease;cursor:pointer}
#lobby.out{opacity:0;pointer-events:none}
#lobby .logo{font-size:64px;font-weight:bold;color:var(--red);letter-spacing:-2px;opacity:0;transition:opacity 1.2s ease, transform 1.2s ease;transform:translateY(14px)}
#lobby .l2{font-size:15px;color:var(--sub);letter-spacing:6px;text-transform:uppercase;opacity:0;transition:opacity 1.2s ease .2s}
#lobby .greet{font-size:30px;font-weight:300;opacity:0;transition:opacity 1.2s ease;margin-top:18px}
#lobby .date{font-size:15px;color:var(--mut);opacity:0;transition:opacity 1.2s ease}
#lobby .hint{position:absolute;bottom:26px;font-size:12px;color:var(--sub);opacity:0;transition:opacity 1s ease 1.5s}
#lobby.s1 .logo{opacity:1;transform:none}#lobby.s1 .l2{opacity:1}#lobby.s1 .hint{opacity:.8}
#lobby.s2 .greet{opacity:1}
#lobby.s3 .date{opacity:1}
#lobby .door{position:absolute;top:0;bottom:0;width:50.5%;background:#0E0609;transition:transform 1.4s cubic-bezier(.7,0,.3,1)}
#lobby .dl{left:0;border-right:1px solid rgba(234,0,41,.35)}#lobby .dr{right:0;border-left:1px solid rgba(234,0,41,.35)}
#lobby.s2 .dl{transform:translateX(-101%)}#lobby.s2 .dr{transform:translateX(101%)}
/* ===== SCENE (animierter Hintergrund) ===== */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#sky{position:absolute;inset:0;z-index:0;transition:background 1.6s linear}
#stars{position:absolute;inset:0 0 32% 0;z-index:0;transition:opacity 2s}
.st{position:absolute;background:#fff;border-radius:50%;animation:tw 4s infinite}
@keyframes tw{0%,100%{opacity:.95}50%{opacity:.2}}
#sun{position:absolute;z-index:0;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,#FFF6D8 0%,#FFD978 45%,rgba(255,180,80,0) 72%);box-shadow:0 0 90px 42px rgba(255,190,90,.32);transition:opacity 2s}
#moon{position:absolute;z-index:0;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#F4F1E6,#C6C1B0);box-shadow:0 0 50px 18px rgba(215,222,255,.18);transition:opacity 2s}
#hglow{position:absolute;left:0;right:0;bottom:23%;height:26%;z-index:1;background:linear-gradient(180deg,rgba(255,128,58,0),rgba(255,128,58,.42));opacity:0;transition:opacity 2s;mix-blend-mode:screen}
#clouds{position:absolute;inset:0 0 30% 0;z-index:1;color:#fff;opacity:calc(.05 + .24*(1 - var(--nf)))}
.cl{position:absolute;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-24vw)}to{transform:translateX(116vw)}}
#cityfar{position:absolute;left:0;right:0;bottom:23%;height:28%;z-index:2;opacity:.8}
#citynear{position:absolute;left:0;right:0;bottom:21%;height:38%;z-index:3}
#cityfar svg,#citynear svg{width:100%;height:100%;display:block}
#citynear .wins{opacity:var(--litw)}
.w{fill:#FFD98A;animation:flk 9s infinite}
@keyframes flk{0%,100%{fill-opacity:.95}50%{fill-opacity:.4}}
.bcn{fill:#FF4D5E;animation:bcnk 2.6s infinite}
@keyframes bcnk{0%,100%{fill-opacity:1}50%{fill-opacity:.1}}
#mull{position:absolute;inset:0 0 21% 0;z-index:4;background:repeating-linear-gradient(90deg,rgba(5,3,8,0) 0 calc(20% - 7px),rgba(7,4,10,.9) calc(20% - 7px) 20%)}
#mull::before{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(120,180,200,.05),rgba(10,6,12,.28))}
#mull::after{content:"";position:absolute;left:0;right:0;top:44%;height:9px;background:rgba(7,4,10,.9)}
#floor{position:absolute;left:0;right:0;bottom:0;height:21%;z-index:5;background:linear-gradient(180deg,#100815,#070409 60%,#05030a)}
#floor::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(150,190,220,calc(.04 + .09*(1 - var(--nf)))),transparent 55%)}
#vig{position:absolute;inset:0;z-index:6;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.6) 100%)}
/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:11px 20px;background:linear-gradient(180deg,rgba(8,4,10,.9),rgba(8,4,10,.68));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:bold;font-size:20px;color:var(--red)}
.brand small{color:var(--mut);font-weight:normal;font-size:12px;letter-spacing:3px;margin-left:10px;text-transform:uppercase}
.huts{display:flex;border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-left:auto}
.huts button{background:none;border:none;color:var(--mut);padding:8px 16px;font-size:12.5px}
.huts button.on{background:var(--red);color:#fff;font-weight:bold}
#clock{font-size:12.5px;color:var(--mut);min-width:140px;text-align:right}
#hutline{position:relative;z-index:20;padding:8px 22px;font-size:12.5px;color:var(--mut);border-bottom:1px solid var(--line);background:rgba(20,9,14,.55);backdrop-filter:blur(4px)}
#hutline b{color:var(--teal)}
/* ===== VIEWS ===== */
.view{display:none;position:relative;z-index:2}
.view.on{display:block;animation:enter .6s ease}
@keyframes enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
/* ===== HUB ===== */
#greetcard{margin:30px auto 0;width:fit-content;max-width:92vw;text-align:center;background:rgba(8,4,10,.32);border:1px solid var(--line);border-radius:16px;padding:14px 30px;backdrop-filter:blur(3px)}
#greetcard h1{font-size:27px;font-weight:300}
#greetcard p{color:var(--mut);font-size:13px;margin-top:5px}
#doors{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-end;padding:30px 20px 50px;perspective:1100px;position:relative;z-index:3}
.door{width:128px;cursor:pointer;text-align:center;transition:transform .3s}
.dbody{position:relative;height:182px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,rgba(49,23,31,.93),rgba(28,13,19,.95));border:1px solid var(--line);border-bottom:3px solid #1b0d13;padding-top:15px;transition:border-color .3s,box-shadow .3s,transform .45s;transform-style:preserve-3d;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.door:hover .dbody{border-color:var(--teal);box-shadow:0 0 28px rgba(100,170,178,.28);transform:rotateY(-13deg)}
.door.red:hover .dbody{border-color:var(--red);box-shadow:0 0 28px rgba(234,0,41,.32)}
.dlight{position:absolute;top:0;left:12%;right:12%;height:4px;border-radius:0 0 4px 4px;background:#3a2a30;transition:all .3s}
.door:hover .dlight{background:#9fe3d8;box-shadow:0 4px 18px rgba(120,220,200,.5)}
.door.red:hover .dlight{background:#ff90a2;box-shadow:0 4px 18px rgba(255,80,110,.5)}
.dnm{font-size:12.5px;font-weight:bold;margin-top:8px}
.drl{font-size:10.5px;color:var(--sub);margin-top:1px;padding:0 4px}
.plate{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#B89A6A;border:1px solid rgba(184,154,106,.45);border-radius:3px;padding:2px 7px;background:rgba(0,0,0,.25);white-space:nowrap}
.dbadge{position:absolute;top:7px;right:7px;background:var(--teal2);color:#fff;font-size:9.5px;font-weight:bold;border-radius:9px;padding:2px 6px;min-width:18px;text-align:center;line-height:1.4}
.dhandle{position:absolute;right:9px;top:53%;width:4px;height:22px;border-radius:2px;background:#B89A6A;opacity:.8}
.door.board{width:226px}
.door.board .dbody{background:linear-gradient(180deg,rgba(22,17,30,.93),rgba(13,10,19,.95))}
#rec{position:relative;z-index:3;max-width:700px;margin:20px auto 6px;padding:0 16px;transition:max-width .6s ease}
.counter{position:relative;background:var(--glass);backdrop-filter:blur(10px);border:1px solid rgba(100,170,178,.35);border-radius:20px;padding:18px 20px;box-shadow:0 20px 55px rgba(0,0,0,.55)}
.rwho{display:flex;gap:14px;align-items:center}
.rwho h2{font-size:16px}
.rwho .so{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.45}
.tri{display:flex;gap:8px;margin-top:14px}
.tri textarea{flex:1;background:rgba(31,15,21,.85);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 13px;font-size:14px;resize:none;height:54px;font-family:inherit}
.tri button{background:var(--red);border:none;color:#fff;border-radius:12px;padding:0 18px;font-weight:bold;font-size:15px}
/* Sophie-Gespräch direkt in der Lobby: Tresen wächst, Chat klappt auf */
#hub.schat #rec{max-width:980px}
#hub.schat .tri,#hub.schat #prop,#hub.schat #famline,#hub.schat .btnrow{display:none}
#lchat{display:none;margin-top:14px;animation:enter .5s ease}
#hub.schat #lchat{display:block}
.lcbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut);margin-bottom:10px}
#lslot{display:flex;min-width:0}
#lslot .rchat{height:min(62vh,620px);width:100%}
#prop{margin-top:14px}
.propbox{background:rgba(31,15,21,.72);border:1px solid var(--line);border-radius:14px;padding:14px}
.propbox .sb{font-size:13.5px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;justify-content:center}
.chip{width:72px;text-align:center;cursor:pointer;opacity:.38;filter:grayscale(.75);transition:all .25s;font-size:10px;color:var(--mut)}
.chip.on{opacity:1;filter:none;color:var(--txt)}
.chip .av{transition:box-shadow .25s}
.chip.on .av{box-shadow:0 0 16px rgba(100,170,178,.55)}
.chip div{margin-top:3px}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#hubfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:22px 16px calc(18px + env(safe-area-inset-bottom));}
#hubfoot button{background:rgba(8,4,10,.45);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
#hubfoot button:hover{color:var(--txt);border-color:var(--teal)}
/* ===== OFFENE CASES ===== */
#activeSessions{padding:0 16px 8px;position:relative;z-index:3}
#activeSessions h3{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal);margin-bottom:8px;opacity:.75}
.sesstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sesstrip::-webkit-scrollbar{display:none}
.sescard{flex:0 0 158px;background:rgba(31,15,21,.88);border:1px solid rgba(100,170,178,.32);border-radius:12px;padding:10px 12px 9px;position:relative;cursor:pointer;transition:border-color .25s,box-shadow .25s}
.sescard:active{border-color:var(--teal);box-shadow:0 0 14px rgba(100,170,178,.25)}
.sc-close{position:absolute;top:7px;right:9px;background:none;border:none;color:var(--mut);font-size:15px;cursor:pointer;padding:0;line-height:1;transition:color .15s}
.sc-close:hover{color:#ff7088}
.sc-avs{display:flex;margin-bottom:7px}
.sc-title{font-size:11.5px;font-weight:bold;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.sc-last{font-size:10px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;min-height:28px}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.sc-ts{font-size:9.5px;color:var(--mut)}
.sc-btn{font-size:10px;background:rgba(234,0,41,.8);border:none;color:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.endsess{background:none;border:1px solid rgba(234,0,41,.45);color:rgba(234,0,41,.8);border-radius:8px;padding:5px 12px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.endsess:hover{background:rgba(234,0,41,.15);border-color:var(--red)}
.btn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 12px;font-size:12.5px}
.btn:hover{border-color:var(--teal);color:var(--txt)}
.btn.on{border-color:var(--teal);color:#fff}
.btn.r{border-color:rgba(234,0,41,.5);color:#FF7088}
.btn.go{background:var(--red);border-color:var(--red);color:#fff;font-weight:bold}
.btn:disabled{opacity:.45;cursor:default}
/* ===== TO-DO PANEL ===== */
#todoTab{position:fixed;right:0;top:38%;z-index:46;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-right:none;border-radius:12px 0 0 12px;color:var(--mut);padding:14px 9px;font-size:12px;letter-spacing:2px;writing-mode:vertical-rl;text-orientation:mixed;cursor:pointer;transition:all .25s;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#todoTab:hover{color:var(--txt);border-color:var(--teal)}
#todoTab .cnt{background:var(--red);color:#fff;border-radius:9px;font-size:10.5px;font-weight:bold;padding:5px 2px;margin-top:8px;letter-spacing:0;writing-mode:horizontal-tb;display:inline-block;min-width:18px;text-align:center}
#todoPanel{position:fixed;top:0;right:0;bottom:0;width:min(370px,94vw);z-index:55;background:rgba(13,6,11,.97);backdrop-filter:blur(14px);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:-18px 0 55px rgba(0,0,0,.5)}
#todoPanel.open{transform:none}
.tdhead{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.tdhead h2{font-size:16px;flex:1}
.tdhead .x{background:none;border:none;color:var(--sub);font-size:20px}
.tdbody{flex:1;overflow-y:auto;padding:14px 16px;scrollbar-width:thin}
.tdlist{background:rgba(31,15,21,.66);border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}
.tdlh{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.tdlh:hover{background:rgba(255,255,255,.03)}
.tdlh .chv{width:14px;color:var(--sub);font-size:10px;transition:transform .15s}
.tdlist.cls .chv{transform:rotate(-90deg)}
.tdlh b{flex:1;font-size:13.5px}
.tdlh .lc{font-size:11px;color:var(--sub);background:rgba(255,255,255,.06);border-radius:9px;padding:2px 8px}
.tdlh .del{background:none;border:none;color:var(--sub);font-size:13px;opacity:.6}
.tdlh .del:hover{color:#FF7088;opacity:1}
.tdlb{padding:2px 12px 10px}
.tdlist.cls .tdlb{display:none}
.tditem{display:flex;align-items:flex-start;gap:9px;padding:6px 2px;border-radius:7px}
.tditem:hover{background:rgba(255,255,255,.03)}
.tditem input[type=checkbox]{width:15px;height:15px;margin-top:2px;accent-color:var(--red);cursor:pointer;flex:0 0 auto}
.tditem .tx{flex:1;font-size:13px;line-height:1.5;color:var(--txt)}
.tditem.done .tx{text-decoration:line-through;color:var(--sub)}
.tditem .del{background:none;border:none;color:var(--sub);font-size:12px;visibility:hidden}
.tditem:hover .del{visibility:visible}
.tditem .del:hover{color:#FF7088}
.tdbadge{display:inline-block;font-size:9px;font-weight:bold;color:var(--teal);background:rgba(100,170,178,.16);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px;letter-spacing:.5px}
.tddate{font-size:10px;color:var(--sub);margin-left:6px}
.tdadd{display:flex;gap:6px;margin-top:7px}
.tdadd input{flex:1;background:#1F0F15;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 10px;font-size:12.5px}
.tdadd input:focus{outline:none;border-color:var(--teal)}
.tdfoot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.tdempty{color:var(--sub);font-size:12px;font-style:italic;padding:5px 2px}
.tdrn{font-family:inherit;font-size:13.5px;font-weight:bold;background:#1F0F15;border:1px solid var(--teal);border-radius:6px;color:var(--txt);padding:3px 7px;flex:1;min-width:0}
.tdprop{background:rgba(31,15,21,.85);border:1px solid rgba(100,170,178,.5);border-radius:12px;padding:12px;margin:8px 0;font-size:13px}
.tdprop label{display:flex;gap:9px;align-items:flex-start;padding:5px 0;cursor:pointer;font-size:13px;color:var(--txt);line-height:1.5}
.tdprop input[type=checkbox]{width:15px;height:15px;margin-top:2px;accent-color:var(--red)}
@media(max-width:880px){#todoTab{top:auto;bottom:90px}}
/* ===== RAUM / MEETING ===== */
.rtop{display:flex;align-items:center;gap:14px;padding:12px 20px;position:relative;z-index:4;flex-wrap:wrap}
.back{background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 14px;font-size:13px}
.back:hover{border-color:var(--teal);color:#fff}
.rtitle{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.rwrap{position:relative;z-index:3;display:flex;gap:18px;max-width:1100px;margin:4px auto 26px;padding:0 16px;align-items:stretch;min-height:calc(100vh - 230px)}
.rcard{width:300px;flex:0 0 300px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;height:fit-content}
.rcard .quote{font-style:italic;color:#E0DCDD;margin:10px 0 4px}
.rcard .desc{font-size:13px;color:var(--mut);line-height:1.55;margin-top:8px}
.rchat{flex:1;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;min-height:240px}
.m{max-width:86%;padding:9px 13px;border-radius:13px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--teal2);color:#fff}
.m.a{align-self:flex-start;background:rgba(49,23,31,.92);border:1px solid var(--line)}
.m.t{align-self:flex-start;color:var(--sub);font-style:italic;font-size:12.5px;background:none;padding:2px 4px}
.m.mara{align-self:flex-start;border:1px solid rgba(234,0,41,.55);background:rgba(38,8,15,.92);color:#FFD9DF;display:flex;gap:10px;align-items:flex-start}
.mwho{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sub);margin:3px 0 -3px}
.rstarts{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;scrollbar-width:thin}
.rstarts button{flex:0 0 auto;background:rgba(31,15,21,.85);border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:7px 10px;font-size:12px;white-space:nowrap}
.rstarts button:hover{border-color:var(--red);color:var(--txt)}
.crow{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-top:1px solid var(--line);margin-top:8px}
.crow textarea{flex:1;background:rgba(36,18,24,.9);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px 11px;font-size:13.5px;resize:none;height:44px;font-family:inherit;min-width:0}
.crow button{background:var(--red);border:none;color:#fff;border-radius:10px;padding:0 16px;font-weight:bold;font-size:15px}
.attbtn{background:rgba(100,170,178,.15)!important;border:1px solid rgba(100,170,178,.5)!important;font-size:17px!important;padding:0 11px!important;opacity:.9;transition:all .2s;color:#fff!important}
.attbtn:hover{background:rgba(100,170,178,.28)!important;opacity:1}
.attbtn.has-file{opacity:1;background:rgba(100,170,178,.3)!important;border-color:var(--teal)!important;box-shadow:0 0 8px rgba(100,170,178,.4)}

   if(!r.ok)throw new Error("HTTP "+r.status);

 }catch(e){return{ok:false,err:String(e&&e.message||e)}}}

const ROOT=document.documentElement;
const STOPS=[[0,[5,9,26],[10,16,38],[18,26,52]],[4.5,[6,10,30],[13,19,44],[26,33,58]],[6,[38,42,86],[120,80,96],[226,140,96]],[7.5,[96,146,205],[148,186,226],[244,196,150]],[12,[108,168,230],[156,200,238],[206,224,242]],[16.5,[96,148,210],[150,180,222],[226,186,140]],[18.7,[56,52,110],[120,76,116],[238,120,76]],[20,[16,18,52],[30,30,70],[70,52,96]],[21.5,[6,10,30],[12,18,42],[22,30,56]],[24,[5,9,26],[10,16,38],[18,26,52]]];
function skyCols(t){let a=STOPS[0],b=STOPS[STOPS.length-1];
for(let i=0;i<STOPS.length-1;i++){if(t>=STOPS[i][0]&&t<=STOPS[i+1][0]){a=STOPS[i];b=STOPS[i+1];break}}
const f=(t-a[0])/((b[0]-a[0])||1);
return [1,2,3].map(k=>a[k].map((v,j)=>Math.round(v+(b[k][j]-v)*f)).join(","))}
function nF(t){if(t<5||t>=21)return 1;if(t<7.5)return 1-(t-5)/2.5;if(t<18.5)return 0;return (t-18.5)/2.5}
let LAPSE=false,simT=0;
function curT(){const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}
function T(){return LAPSE?simT:curT()}
function phaseLabel(t){if(t<5)return "Die Stadt schläft nie ganz.";if(t<7.5)return "Sonnenaufgang über der Stadt.";if(t<11)return "Die Stadt ist wach.";if(t<17)return "Voller Betrieb da draußen.";if(t<19.5)return "Abendlicht über der Skyline.";if(t<21.5)return "Die Stadt schaltet die Lichter an.";return "Die Stadt leuchtet."}
function updateSky(){const t=T();
const c=skyCols(t);
document.getElementById("sky").style.background=`linear-gradient(180deg,rgb(${c[0]}),rgb(${c[1]}) 52%,rgb(${c[2]}))`;
const n=nF(t);ROOT.style.setProperty("--nf",n.toFixed(2));
ROOT.style.setProperty("--litw",Math.min(1,n*1.1+((t>17&&t<22)?0.15:0)).toFixed(2));
document.getElementById("stars").style.opacity=(n*.95).toFixed(2);
const sun=document.getElementById("sun"),moon=document.getElementById("moon");
if(t>5.3&&t<19.7){const f=Math.min(1,Math.max(0,(t-5.5)/14));sun.style.opacity=1;sun.style.left=(4+88*f)+"vw";sun.style.top=(56-48*Math.sin(Math.PI*f))+"vh"}else sun.style.opacity=0;
const tm=(t-20+24)%24;
if(tm<10.5){const f=tm/10.5;moon.style.opacity=.95;moon.style.left=(6+86*f)+"vw";moon.style.top=(50-42*Math.sin(Math.PI*f))+"vh"}else moon.style.opacity=0;
const g=Math.max(0,1-Math.abs(t-6.3)/1.6)+Math.max(0,1-Math.abs(t-19.2)/1.6);
document.getElementById("hglow").style.opacity=Math.min(.8,g).toFixed(2);
const gs=document.getElementById("gsub");if(gs)gs.textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+phaseLabel(t)+(LAPSE?" · Zeitraffer läuft":"")}

setInterval(()=>{if(LAPSE){simT=(simT+0.055)%24;updateSky();clock()}},120);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genCity(seed,fill,withWin){const r=rng(seed);let x=-20,b="",w="";
while(x<1640){const bw=34+r()*70,bh=55+r()*215,by=320-bh;
b+=`<rect x="${x.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${fill}"/>`;
if(withWin&&r()>0.78)b+=`<rect x="${(x+bw/2).toFixed(1)}" y="${(by-18).toFixed(1)}" width="2" height="18" fill="${fill}"/><circle cx="${(x+bw/2+1).toFixed(1)}" cy="${(by-20).toFixed(1)}" r="2" class="bcn"/>`;
if(withWin){for(let wy=by+8;wy<312;wy+=11){for(let wx=x+5;wx<x+bw-6;wx+=9){if(r()>0.5)w+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="4.6" height="6" class="w" style="animation-delay:${(r()*9).toFixed(1)}s"/>`}}}
x+=bw+4+r()*16}
return `<svg viewBox="0 0 1600 320" preserveAspectRatio="xMidYMax slice"><g>${b}</g><g class="wins">${w}</g></svg>`}

function closeSession(key){ST.sessions=(ST.sessions||[]).filter(s=>s.key!==key);save();renderSessions()}
function confirmCloseSession(key){if(!key)return;const s=(ST.sessions||[]).find(x=>x.key===key);const title=s?s.title:"diesen Case";if(confirm('"'+title+'" beenden und aus der Übersicht entfernen?\nDer Gesprächsverlauf bleibt gespeichert.')){closeSession(key);if(CUR.key===key)leaveRoom();else toast("Case beendet.")}}

function xmlEnt(s){return String(s).replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#x([0-9a-fA-F]+);/g,(m,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&#(\d+);/g,(m,n)=>String.fromCodePoint(+n))}
function xmlText(x){return xmlEnt(String(x).replace(/<\/(w:p|a:p)>/g,"\n").replace(/<(w:br|a:br|w:tab)[^>]*\/?>/g," ").replace(/<[^>]+>/g,"")).replace(/[ \t]+/g," ").replace(/ ?\n ?/g,"\n").replace(/\n{2,}/g,"\n").trim()}
function extractOffice(f,ext){
  return f.arrayBuffer().then(buf=>JSZip.loadAsync(buf)).then(zip=>{
    const num=n=>parseInt((n.match(/(\d+)\.xml$/)||[0,"0"])[1],10);
    if(ext==="docx"){const d=zip.file("word/document.xml");return d?d.async("string").then(xmlText):""}
    if(ext==="pptx"){
      const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
      return Promise.all(slides.map(n=>{const i=num(n),nf=zip.file("ppt/notesSlides/notesSlide"+i+".xml");
        return Promise.all([zip.file(n).async("string"),nf?nf.async("string"):Promise.resolve("")])
        .then(([sx,nx])=>{const t=xmlText(sx),nt=nx?xmlText(nx).replace(/\s*\d+\s*$/,""):"";
          return "--- Folie "+i+" ---\n"+(t||"(ohne Text)")+(nt?"\n[Notiz] "+nt:"")})}))
      .then(parts=>parts.join("\n"));
    }
    const ss=zip.file("xl/sharedStrings.xml");
    const sheets=Object.keys(zip.files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
    return Promise.all([ss?ss.async("string"):Promise.resolve("")].concat(sheets.map(n=>zip.file(n).async("string"))))
    .then(parts=>xmlText(parts.join("\n")));
  });
}
function fileChosen(input){
  const fl=Array.from(input.files||[]);input.value="";
  fl.forEach(f=>{
    const ext=f.name.split(".").pop().toLowerCase();
    if((ext==="docx"||ext==="pptx"||ext==="xlsx")&&typeof JSZip!=="undefined"){
      extractOffice(f,ext).then(text=>{text=String(text||"").slice(0,80000);
        if(!text.trim())return toast("⚠ "+f.name+": kein Text gefunden.");
        PENDFILES.push({name:f.name,kind:"doc",text});renderFilePrev()})
      .catch(()=>toast("⚠ "+f.name+" konnte nicht gelesen werden."));
    } else if(ext==="pdf"||/^image\//.test(f.type||"")){
      const reader=new FileReader();
      reader.onload=e=>{PENDFILES.push({name:f.name,kind:ext==="pdf"?"pdf":"image",mime:ext==="pdf"?"application/pdf":(f.type||"image/png"),data:e.target.result.split(",")[1]});renderFilePrev()};
      reader.readAsDataURL(f);
    } else {
      const reader=new FileReader();
      reader.onload=e=>{const text=String(e.target.result||"").slice(0,80000);
        if(!text.trim())return toast("⚠ "+f.name+": kein Text gefunden.");
        PENDFILES.push({name:f.name,kind:"doc",text});renderFilePrev()};
      reader.readAsText(f);
    }
  });
}

/* ================= ZUGRIFFSSCHUTZ + GERÄTE-SYNC ================= */
const SYNCID="daniel-dreos";let KEY=null,SYNCAT=0,SYTMR=null;
function lockBlob(){try{const o=JSON.parse(localStorage.getItem("dreosLock")||"null");if(o&&o.check&&o.prof)return o}catch(e){}return LOCK0}
function b642buf(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function buf2b64(a){let s="";a=new Uint8Array(a);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function hex2buf(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
async function deriveKey(p){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:hex2buf(LOCK0.salt),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["encrypt","decrypt"])}
async function aesDec(k,b64){const d=b642buf(b64);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},k,d.slice(12));return new TextDecoder().decode(pt)}
async function aesEnc(k,txt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(txt)));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return buf2b64(o)}
async function lockOk(k){try{return(await aesDec(k,lockBlob().check))==="DREOS_OK"}catch(e){return false}}
function lkMsg(t,c){const m=document.getElementById("lkmsg");if(m){m.textContent=t;m.style.color=c||"var(--sub)"}}
async function syncFetchRaw(tmo){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),tmo||4000);
 const r=await fetch(FS.url+"/rest/v1/dreos_sync?id=eq."+SYNCID+"&select=payload,updated_at",{headers:{apikey:FS.key,Authorization:"Bearer "+FS.key},signal:c.signal});clearTimeout(t);
 const rows=await r.json();return rows.length?rows[0].payload:null}catch(e){return null}}
function mergeState(r){const lk=ST.key,lc=ST.chats||{},lt=ST.todos,lf=ST.fokus,ld=ST.docs||{};for(const k in r)ST[k]=r[k];
 if(lk&&!ST.key)ST.key=lk;ST.chats=ST.chats||{};ST.docs=ST.docs||{};
 for(const c in lc){const rc=ST.chats[c];if(!rc||lc[c].length>rc.length)ST.chats[c]=lc[c]}
 for(const c in ld){if(!ST.docs[c]||!ST.docs[c].length)ST.docs[c]=ld[c]}
 const tn=t=>t&&t.lists?t.lists.reduce((s,l)=>s+(l.items||[]).length,0):0;
 if(tn(ST.todos)===0&&tn(lt)>0)ST.todos=lt;
 if(lf&&lf.length&&(!ST.fokus||!ST.fokus.length))ST.fokus=lf}
async function syncPull(tmo){if(!KEY)return false;const p=await syncFetchRaw(tmo);if(!p)return false;
 let remote;try{remote=JSON.parse(await aesDec(KEY,p))}catch(e){return false}
 if((remote._ts||0)>(ST._ts||0)){mergeState(remote);localStorage.setItem("dreos2",JSON.stringify(ST));SYNCAT=Date.now();return true}
 SYNCAT=Date.now();return false}
async function pushCore(){if(!KEY)return;try{
 const payload=await aesEnc(KEY,JSON.stringify(ST));const now=new Date().toISOString();
 const r=await fsApi("dreos_sync?id=eq."+SYNCID,{method:"PATCH",body:JSON.stringify({payload,updated_at:now})});
 const rows=await r.json().catch(()=>[]);
 if(!Array.isArray(rows)||!rows.length)await fsApi("dreos_sync",{method:"POST",body:JSON.stringify({id:SYNCID,payload})});
 SYNCAT=Date.now()}catch(e){}}
function syncPush(){if(!KEY)return;clearTimeout(SYTMR);SYTMR=setTimeout(pushCore,1500)}
async function syncNow(){const el=document.getElementById("syncst");if(el)el.textContent="Synchronisiere…";
 const got=await syncPull(5000);await pushCore();
 if(el)el.textContent="✓ Abgeglichen: "+new Date().toLocaleTimeString("de-DE");
 if(got){toast("Neuer Stand übernommen – lade neu");setTimeout(()=>location.reload(),900)}}
function lockNow(){localStorage.removeItem("dreosKraw");location.reload()}
async function changePass(){const o=prompt("Aktuelle Passphrase:");if(o===null)return;
 const k=await deriveKey(o);if(!await lockOk(k)){toast("Aktuelle Passphrase falsch");return}
 const n=prompt("Neue Passphrase (mind. 8 Zeichen):");if(!n||n.length<8){toast("Zu kurz – nicht geändert");return}
 const nk=await deriveKey(n);
 const blob={check:await aesEnc(nk,"DREOS_OK"),prof:await aesEnc(nk,PROFILE)};
 localStorage.setItem("dreosLock",JSON.stringify(blob));KEY=nk;
 if(localStorage.getItem("dreosKraw")){const raw=await crypto.subtle.exportKey("raw",nk);localStorage.setItem("dreosKraw",buf2b64(raw))}
 ST._lock=blob;save();toast("Passphrase geändert – gilt nach Sync auf allen Geräten")}
async function startAfterUnlock(){document.getElementById("lock").classList.add("off");
 await syncPull(3500);
 if(ST._lock)localStorage.setItem("dreosLock",JSON.stringify(ST._lock));
 try{PROFILE=await aesDec(KEY,lockBlob().prof)}catch(e){PROFILE=""}
 bootApp();
 if(location.protocol==="https:"&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
async function unlock(){const p=document.getElementById("lkpass").value;if(!p)return;
 if(!window.crypto||!crypto.subtle){lkMsg("Dieser Browser unterstützt WebCrypto nicht.","#FF7088");return}
 document.getElementById("lkbtn").textContent="Prüfe…";lkMsg("");
 try{const k=await deriveKey(p);
  if(await lockOk(k)){KEY=k;
   if(document.getElementById("lkrem").checked){const raw=await crypto.subtle.exportKey("raw",k);localStorage.setItem("dreosKraw",buf2b64(raw))}
   await startAfterUnlock();return}
  const rp=await syncFetchRaw(5000);
  if(rp){try{const st=JSON.parse(await aesDec(k,rp));
   if(st&&st._lock)localStorage.setItem("dreosLock",JSON.stringify(st._lock));
   else localStorage.setItem("dreosLock",JSON.stringify({check:await aesEnc(k,"DREOS_OK"),prof:await aesEnc(k,PROFILE||"")}));
   KEY=k;if(document.getElementById("lkrem").checked){const raw=await crypto.subtle.exportKey("raw",k);localStorage.setItem("dreosKraw",buf2b64(raw))}
   await startAfterUnlock();return}catch(e){}}
  lkMsg("Falsche Passphrase.","#FF7088");document.getElementById("lkbtn").textContent="Entsperren"
 }catch(e){lkMsg("Fehler: "+e.message,"#FF7088");document.getElementById("lkbtn").textContent="Entsperren"}}
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible"||!KEY)return;
 if(Date.now()-(window._lp||0)<30000)return;window._lp=Date.now();
 const ci=document.getElementById("ci"),tq=document.getElementById("triq"),cb=document.getElementById("chatbox");
 if((ci&&ci.value.trim())||(tq&&tq.value.trim())||(cb&&cb.style.display!=="none"))return;
 if(await syncPull(4000)){toast("Neuer Stand vom anderen Gerät");setTimeout(()=>location.reload(),900)}});
(async function boot(){
 if(!window.crypto||!crypto.subtle){lkMsg("Dieser Browser unterstützt WebCrypto nicht – bitte Safari/Chrome verwenden.","#FF7088");return}
 try{const raw=localStorage.getItem("dreosKraw");
  if(raw){const k=await crypto.subtle.importKey("raw",b642buf(raw),"AES-GCM",true,["encrypt","decrypt"]);
   if(await lockOk(k)){KEY=k;await startAfterUnlock();return}
   localStorage.removeItem("dreosKraw")}}catch(e){}
 setTimeout(()=>{const i=document.getElementById("lkpass");if(i)i.focus()},400)})();
</script>
